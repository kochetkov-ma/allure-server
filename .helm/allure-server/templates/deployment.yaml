apiVersion: apps/v1
kind: Deployment
metadata:
  name: allure-server-deployment
  labels:
  {{- include "allure-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
  {{- include "allure-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
    {{- include "allure-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "allure-server.serviceAccountName" . }}
      securityContext:
      {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- include "helpers.list-env-variables" . | indent 12 }}
          {{- include "helpers.list-secret-env-variables" . | indent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /actuator/health is permitAll in both auth modes (SecurityConfiguration), same as the image HEALTHCHECK.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.startupInitialDelay }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.livenessInitialDelay }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.readinessInitialDelay }}
            periodSeconds: 30
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.databaseCrt.enabled .Values.pvc.enabled }}
          volumeMounts:
            {{- if .Values.databaseCrt.enabled }}
            - name: crt
              mountPath: {{ .Values.databaseCrt.crt.targetDir }}
            {{- end }}
            {{- if .Values.pvc.enabled }}
            - name: storage
              mountPath: /allure
            {{- end }}
          {{- end }}
      {{- if or .Values.databaseCrt.enabled .Values.pvc.enabled }}
      volumes:
        {{- if .Values.databaseCrt.enabled }}
        - name: crt
          configMap:
            name: allure-server-crt
        {{- end }}
        {{- if .Values.pvc.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: allure-server-storagepvc
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
  {{- end }}
