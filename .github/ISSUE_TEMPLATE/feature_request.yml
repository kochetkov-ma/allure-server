name: Feature request
description: Propose a new capability or an improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Usage questions belong in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and in which situation does it hurt.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour you want. Include API shape, config keys or UI changes if you have them in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - REST API
        - Web UI
        - Report generation
        - Plugins and TMS integration
        - Authentication and security
        - Persistence and storage
        - Packaging, Docker or Helm
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you already tried and why they are not enough.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
