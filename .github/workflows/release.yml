name: Upload Release Asset

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      ## Build prepare ##
      - name: Fast checkout
        uses: actions/checkout@v4
      - name: Set RELEASE_VERSION
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      ## Build the runnable jar (used as the GitHub Release asset) ##
      - name: Build with Gradle
        run: ./gradlew -Pversion=${{ env.RELEASE_VERSION }} --stacktrace bootJar

      ## Release in DockerHub — multistage Dockerfile builds the jar inside the image ##
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          platforms: linux/amd64,linux/arm64
          name: kochetkovma/allure-server
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: "latest,${{ env.RELEASE_VERSION }}"

      ## Release in GitHub ##
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            Changes in this Release
            - First Change
          draft: false
          prerelease: false
          files: build/libs/allure-server-${{ env.RELEASE_VERSION }}.jar
