name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      ## Build prepare ##
      - name: Fast checkout
        uses: actions/checkout@v4
      - name: Set RELEASE_VERSION
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      ## Build the runnable jar (used as the GitHub Release asset) ##
      - name: Build with Gradle
        run: ./gradlew -Pversion=${{ env.RELEASE_VERSION }} --stacktrace bootJar

      ## Docker image — multistage Dockerfile builds the jar inside the image ##
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (Docker Hub + GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kochetkovma/allure-server:latest
            kochetkovma/allure-server:${{ env.RELEASE_VERSION }}
            ghcr.io/kochetkov-ma/allure-server:latest
            ghcr.io/kochetkov-ma/allure-server:${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ## Release in GitHub ##
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            Changes in this Release
            - First Change
          draft: false
          prerelease: false
          files: build/libs/allure-server-${{ env.RELEASE_VERSION }}.jar
