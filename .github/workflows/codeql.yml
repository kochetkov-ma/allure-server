name: CodeQL

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze java-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the CodeQL SARIF results

    steps:
      - name: Fast checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Manual build mode: autobuild would compile with the runner default JDK and
      # cannot be trusted to run the YouTrack OpenAPI codegen that compileJava needs.
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # compileJava pulls openApiGenerate; it skips processResources, so no Tailwind
      # binary download and no tests - only the sources CodeQL actually analyses.
      - name: Compile with Gradle
        run: ./gradlew --stacktrace compileJava

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:java-kotlin
