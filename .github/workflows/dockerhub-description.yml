name: Docker Hub description

# Pushes docs/DOCKERHUB.md to the Docker Hub repository description whenever that file
# changes on master, so a doc fix ships without cutting a release. release.yml pushes the
# same file again at release time, which keeps the Hub page correct even if a release is
# built from a tag that never passed through master.

on:
  push:
    branches:
      - master
    paths:
      - 'docs/DOCKERHUB.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

permissions: {}

jobs:
  description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fast checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Docker Hub caps full_description at 25000 characters and truncates silently.
      - name: Check description size
        run: |
          set -euo pipefail
          SIZE="$(wc -c < docs/DOCKERHUB.md)"
          echo "docs/DOCKERHUB.md is ${SIZE} characters (Docker Hub limit: 25000)"
          if [ "$SIZE" -gt 25000 ]; then
            echo "::error file=docs/DOCKERHUB.md::Too long for Docker Hub: ${SIZE} > 25000 characters"
            exit 1
          fi

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: kochetkovma/allure-server
          readme-filepath: ./docs/DOCKERHUB.md
