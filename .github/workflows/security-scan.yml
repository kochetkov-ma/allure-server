name: Security scan

# Scans a PUBLISHED image, not a locally built one, so the findings describe exactly what
# users pull. Three ways in:
#   workflow_call  - release.yml calls this right after the image is pushed. A `release:
#                    published` trigger does not work here: the release is created by
#                    softprops/action-gh-release under GITHUB_TOKEN, and GitHub never
#                    cascades GITHUB_TOKEN-raised events into other workflows.
#   workflow_dispatch - on-demand scan of any tag, e.g. an already-shipped release.
#   schedule       - weekly re-scan of :latest, to catch CVEs disclosed after the release.

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Image tag to scan, without the leading v (e.g. 3.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to scan, without the leading v (e.g. 3.0.0)'
        required: false
        default: 'latest'
        type: string
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read          # pull the published image from GHCR
      security-events: write  # upload the Trivy SARIF results

    steps:
      - name: Fast checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Scheduled runs carry no inputs, so they fall back to :latest.
      - name: Resolve image reference
        id: ref
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          TAG="${IMAGE_TAG:-latest}"
          TAG="${TAG#v}"
          IMAGE="ghcr.io/kochetkov-ma/allure-server:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Human-readable copy for release triage; never fails the job, findings are the point.
      - name: Trivy scan (table, printed to the log)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          # Unlike the SARIF scan, triage needs unfixed CVEs too: hiding them reads as an all-clear.
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          retention-days: 30
