### Internal Spring Configuration
#server:
#  servlet:
#    context-path: "/server"
spring:
  servlet:
    multipart.max-file-size: 100MB
    multipart.max-request-size: 100MB
  mvc:
    # Enable HiddenHttpMethodFilter so HTML <form method="post"> with hidden
    # field _method=delete/put is routed to @DeleteMapping / @PutMapping handlers.
    # Required by /app/reports confirm-delete dialog (server-rendered UI).
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: "jdbc:h2:file:./allure/db"
    # H2 default username
    username: sa
    # H2 default password (empty)
    password:
  jpa:
    database: H2
    show-sql: false
    hibernate.ddl-auto: update
  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: basic

server.port: ${PORT:8080}

### JTE server-side templating
# Templates are precompiled by the gg.jte.gradle plugin (see build.gradle "jte { generate() }").
# Generated Java sources land in build/generated-sources/jte/ and are compiled into the bootJar,
# so runtime loads templates from the classpath — no src/main/jte on disk at runtime required.
gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

### Security
# Authentication is always enabled. The bootstrap main administrator is seeded from
# basic.auth.username / basic.auth.password on first startup; subsequent changes are
# managed through the /app/admin/users UI (DB is authoritative).
#
# basic.auth.enable is DEPRECATED. It is still honored for backward compatibility:
# when set to true every request except public static assets (css/js/img, favicon)
# requires authentication — this explicitly includes /api/** and /allure/** (the
# pre-2.x behavior), so deployments that relied on it stay protected after upgrade.
# Prefer the runtime 'require API auth' toggle at /app/admin/settings
# (app.security.require-api-auth) and remove this flag.
basic:
  auth:
    username: ${BASIC_AUTH_USERNAME:admin}
    password: ${BASIC_AUTH_PASSWORD:admin}
    enable: false

# app.security.require-api-auth controls /api/** protection on FIRST startup only —
# once the system-settings row is written the database value wins. Admins flip this
# at runtime via /app/admin/settings.
app:
  security:
    require-api-auth: false
    enable-oauth2: false

### App Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url:
      - /swagger/theme.css
    custom-js-url:
      - /swagger/brand.js

# #################
# Deprecated format. Not supported!
# #################
# allure:
#   results.dir: allure/results/
#   reports:
#     dir: allure/reports/
#     path: reports/
#     history.level: 20
#   support.old.format: false
#   date.format: "yy/MM/dd HH:mm:ss"
allure:
  title: "BrewCode | Allure Report"
  # FROM URL: https://avatars.githubusercontent.com/u/16944358?v=4
  # FROM FILE: file:/images/logo.png
  logo: ""
  resultsDir: allure/results/
  reports:
    dir: allure/reports/
    path: reports/
    history-level: 20
  support-old-format: false
  date-format: "yy/MM/dd HH:mm:ss"
  clean:
    dryRun: false
    time: "00:00"
    ageDays: 90
    paths:
      - path: "manual_uploaded"
        ageDays: 30
  server-base-url:
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.core: WARN
    org.springframework.beans.factory.support: WARN
    ru.iopump.qa.allure: INFO # Allure Server Logs
    ru.iopump.qa.allure.api: DEBUG

tms:
  enabled: false
  host: tms.localhost
  api-base-url: https://${tms.host}/api
  token: ${TMS_TOKEN:}
  issue-key-pattern: "[A-Za-z]+-\\d+"
  dry-run: false
